name: V3 Daily Signal

on:
  schedule:
    # Taiwan time 14:30 = UTC 06:30, after market close.
    - cron: "30 6 * * 1-5"
  workflow_dispatch:

jobs:
  run-signal:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        # 已更新為 actions/checkout@v4.2.2 的完整 Commit SHA，支援 Node.js 24
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup uv
        # 已升級並更新為 astral-sh/setup-uv@v5.1.0 的完整 Commit SHA，支援 Node.js 24
        uses: astral-sh/setup-uv@3f993d0d8299173f4e3b7db2c4819d4586d14878
        with:
          python-version: "3.11"

      - name: Install deps
        run: uv sync

      - name: Run signal engine
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
        run: uv run python main.py
