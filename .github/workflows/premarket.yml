name: Premarket Night Session

on:
  schedule:
    # 台灣時間 08:18（夜盤 05:00 收盤後、開盤 09:00 前，避開整點與半點排隊高峰）
    - cron: '18 8 * * 1-5'
      timezone: 'Asia/Taipei'
  workflow_dispatch:  # 允許手動觸發測試

jobs:
  run-premarket:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: uv sync

      - name: Random delay jitter
        if: github.event_name == 'schedule'
        run: |
          DELAY=$((RANDOM % 60 + 5))
          echo "🎲 Random jitter: sleeping for ${DELAY}s to randomize execution timing..."
          sleep ${DELAY}

      - name: Run premarket report
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
        run: uv run python premarket.py
